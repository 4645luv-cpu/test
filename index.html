<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプルアラーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>⏰ シンプルアラーム</h1>
      <div id="current-time" class="current-time">--:--:--</div>
    </header>

    <section class="set-alarm">
      <h2>アラームを追加</h2>
      <div class="input-group">
        <input type="time" id="alarm-time" />
        <input type="text" id="alarm-label" placeholder="ラベル（任意）" maxlength="30" />
        <button id="add-btn">追加</button>
      </div>
    </section>

    <section class="alarm-list">
      <h2>アラーム一覧</h2>
      <ul id="alarms"></ul>
      <p id="empty-msg" class="empty-msg">アラームが登録されていません</p>
    </section>
  </div>

  <!-- 通知音用の AudioContext ベルを JS で生成するので音声ファイル不要 -->
  <script src="app.js"></script>
</body>
</html>
